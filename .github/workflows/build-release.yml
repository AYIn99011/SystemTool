name: Build & Package (net10.0-windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore & Build (Release, win-x64)
        run: dotnet build -c Release -r win-x64 --self-contained false --no-incremental

      - name: Publish single file
        run: >
          dotnet publish -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:SelfContained=false -p:PublishSelfContained=false
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false
          -p:DebugType=none -p:DebugSymbols=false --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemTool-net10-win-x64
          path: bin/Release/net10.0-windows/win-x64/publish/

      - name: Zip package
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path "bin\Release\net10.0-windows\win-x64\publish\*" -DestinationPath "SystemTool-${{ github.ref_name }}-win-x64.zip"

      - name: Extract current version release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $text = [System.IO.File]::ReadAllText("RELEASE_NOTES.md", [System.Text.Encoding]::UTF8)
          $m = [regex]::Matches($text, '(?m)^# ')
          if ($m.Count -eq 0) { throw "RELEASE_NOTES.md 中未找到版本章节 (^# )，拒绝生成空正文" }
          $start = $m[0].Index
          $end = $text.Length
          if ($m.Count -gt 1) { $end = $m[1].Index }
          $section = $text.Substring($start, $end - $start).TrimEnd()
          [System.IO.File]::WriteAllText("RELEASE_NOTES_CURRENT.md", $section + "`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host "已提取当前版本正文，前200字符:"
          Write-Host $section.Substring(0, [Math]::Min(200, $section.Length))

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${{ github.ref_name }}" --title "系统工具箱 ${{ github.ref_name }}" --notes-file RELEASE_NOTES_CURRENT.md "SystemTool-${{ github.ref_name }}-win-x64.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
